name: Feature request
description: Propose a new engine capability, workflow improvement, or documentation addition.
title: "[Feature]: "
labels: ["enhancement"]
body:

- type: markdown
    attributes:
      value: |
        Thanks for taking the time to propose a new feature for Frostnux.
        Please describe the problem you are trying to solve.

- type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case and pain points, rather than jumping straight to the solution.
    validations:
      required: true

- type: textarea
    id: proposed_solution
    attributes:
      label: Proposed solution
      description: Optional. How you would like it to work.
    validations:
      required: false

- type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Any alternative solutions or features you've considered.
    validations:
      required: false

- type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Screenshots, reference links, related issues, etc.
    validations:
      required: false
